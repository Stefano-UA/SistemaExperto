name: Execute Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "requirements.txt"
      - ".github/workflows/test.yaml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        env:
          PYTHONPATH: src
        run: |
          # Load .env variables if .env.example exists (to simulate local env)
          if [ -f .env.example ]; then
            cp .env.example .env
          fi
          # Run pytest via the existing test script or directly
          # Using PYTHONPATH=src directly to ensure isolation
          PYTHONPATH=src pytest test/
